version: 2
updates:
  - package-ecosystem: maven
    directories:
      - "/backend"
      - "/backend/services/*"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - "/"
      - "/backend/services/*"
      - "/pre-push/ci"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    # Java sürümü (temurin-25 → 26) ve Maven 3.9 → 3.10 bilinçli kararla yükseltilir; Dependabot bunları "minor" sayıp
    # gruplu açıyordu (PR #168). Yama sürümleri akmaya devam eder.
    ignore:
      - dependency-name: "maven"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
