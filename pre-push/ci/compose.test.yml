# Isolated disposable PostgreSQL; never references the root Compose or real ENV.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ltz_test
      POSTGRES_PASSWORD: ltz_test_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-test-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltz_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
