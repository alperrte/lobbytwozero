# ==========================================
# LTZ - messaging-service
# ==========================================

# APPLICATION
spring.application.name=messaging-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_MESSAGING_NAME:messaging_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# Havuzdan bağlantı 5 sn içinde alınamazsa istek beklemez: 503 SERVICE_BUSY + Retry-After (varsayılan 30 sn bekleyip
# 500 dönerdi). Örnek başına bağlantı: havuz + 1 (canlı akış aktarımının LISTEN bağlantısı, havuz dışı). SSE akışları
# bağlantı tutmaz (open-in-view kapalı). Toplam (örnek sayısı x (havuz + 1)) PostgreSQL max_connections'ı aşmamalı.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=messaging

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - access token dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE kullanilir;
# degerler Auth Service ile ayni olmalidir.
ltz.messaging.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.messaging.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.messaging.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servis token'ı (svc+jwt) beklenen aud: bu servisin adı. Yeni ENV değil; Auth'ta sabit (D4 hesap silme).
ltz.messaging.auth.service-audience=messaging-service

# MESSAGING - istek ve grup sinirlari
# Mesaj gövdesi en fazla 4000 karakter; çok baytlı karakterler (emoji, Türkçe) için 32 KB
ltz.messaging.request-limit.max-body-size=32KB
# Sahip dahil grup basina en fazla uye. Social'in engel sorgusu tek cagrida en fazla 100 kimlik kabul eder.
ltz.messaging.groups.max-members=100

# MESSAGING - mesajlar (MSG-06/07/08/13). Gönderim oranı: kullanıcı başına dakikada en fazla mesaj (SECURITY.md 12).
ltz.messaging.messages.max-per-minute=30
ltz.messaging.messages.default-page-size=30
ltz.messaging.messages.max-page-size=100
ltz.messaging.messages.default-conversation-page-size=20
ltz.messaging.messages.max-conversation-page-size=50
# MSG-26: gonderimden sonra herkesten silme suresi.
ltz.messaging.messages.delete-for-everyone-window=PT48H
# MSG-23: kullanici basina dakikada tepki degisikligi siniri.
ltz.messaging.reactions.max-per-minute=60

# MESSAGING - gerçek zamanlı akış (SSE, MSG-09; docs/decisions/0001-gercek-zamanli-mesajlasma.md). Kalp atışı Gateway'in
# proxy okuma zaman aşımından (REST_CLIENT_READ_TIMEOUT_MS, 5 sn) kısa olmalıdır. Akış ayrıca token bitişinde kapanır.
ltz.messaging.stream.heartbeat=PT4S
ltz.messaging.stream.max-duration=PT30M
ltz.messaging.stream.max-per-user=5
# Ornekler arasi aktarim (ADR 0001): postgres (LISTEN/NOTIFY, varsayilan) | local (tek ornek, dogrudan).
# Kullanici basina akis siniri (max-per-user) ornek basinadir: ornegin kaynagini korur.
ltz.messaging.stream.relay=postgres

# MESSAGING - engel kontrolu (MSG-15): social-service POST /internal/v1/blocks/check. Auth'tan aud=social-service,
# scope=blocks:check servis token'i alinir. Gizli anahtar yalniz ortam degiskeninden gelir; bos ise engel sorgulanamaz
# ve engel kontrolu gereken islemler fail-closed 503 doner.
ltz.messaging.clients.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8080}
ltz.messaging.clients.token-path=/internal/v1/service-tokens
ltz.messaging.clients.client-id=messaging-service
ltz.messaging.clients.client-secret=${AUTH_MESSAGING_SERVICE_CLIENT_SECRET:}
ltz.messaging.clients.social-service-url=${SOCIAL_SERVICE_URL:http://social-service:8080}
ltz.messaging.clients.blocks-check-path=/internal/v1/blocks/check
# Engel adaptoru: social (tek uretim degeri). Testler kendi sahte adaptorunu secer.
ltz.messaging.blocks.adapter=social

# MESSAGING - olay teslimi (MSG-16, docs/architecture.md 6.2). Adaptor: unavailable (varsayilan; notification-service
# alici ucu ve Auth'ta messaging-service -> notification-service events:ingest cifti yok, olaylar bekler) | notification
# (POST {NOTIFICATION_SERVICE_URL}/internal/events, aud=notification-service). Yeni ENV yok: hedef hazir olunca
# LTZ_MESSAGING_OUTBOX_ADAPTER=notification verilir. Saklama: her mesaj bir MessageSent urettiginden retention'dan eski
# olaylar durumdan bagimsiz silinir (bayat "yeni mesaj" bildirimi gonderilmez, tablo sinirsiz buyumez).
ltz.messaging.outbox.adapter=unavailable
ltz.messaging.outbox.notification-service-url=${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
ltz.messaging.outbox.poll-interval=PT5S
ltz.messaging.outbox.batch-size=50
ltz.messaging.outbox.lease=PT1M
ltz.messaging.outbox.max-attempts=10
ltz.messaging.outbox.base-backoff=PT30S
ltz.messaging.outbox.max-backoff=PT1H
ltz.messaging.outbox.retention=P7D
ltz.messaging.outbox.cleanup-interval=PT10M
ltz.messaging.outbox.cleanup-batch-size=5000

# MESSAGING - gorsel yukleme (MSG-17, SECURITY.md 13). Dosya basina azami 1 MB sabittir (MessageAttachment); icerik
# messaging_db'de (bytea) saklanir. Mesaja baglanmayan yuklemeler pending-ttl sonunda silinir.
ltz.messaging.attachments.max-per-minute=10
ltz.messaging.attachments.max-pending=10
ltz.messaging.attachments.pending-ttl=PT1H
ltz.messaging.attachments.cleanup-interval=PT10M
# PNG/JPEG cozme bellegini sinirlar (4096 x 3072); GIF cozulmez, istemcideki cozme yuku kenar x kenar x kare ile sinirli.
ltz.messaging.attachments.max-side=4096
ltz.messaging.attachments.max-pixels=12582912
ltz.messaging.attachments.max-gif-side=2048
ltz.messaging.attachments.max-gif-frames=300
ltz.messaging.attachments.max-gif-pixels=150000000
ltz.messaging.attachments.concurrency=2
ltz.messaging.attachments.acquire-timeout=PT2S

# MESSAGING - sesli mesaj (MSG-21, SECURITY.md 13). Yalniz Opus (WebM/Ogg), dosya basina 1 MB (gorselle ayni gövde
# siniri ve yukleme orani). Sure paketlerden hesaplanir; tolerans, kayit 2:00'de durunca olusan birkac ms fazla icindir.
# Sinirlar message_attachments.duration_ms CHECK'i (500-121000 ms) disina cikamaz.
ltz.messaging.voice.min-duration=PT0.5S
ltz.messaging.voice.max-duration=PT2M
ltz.messaging.voice.duration-tolerance=PT1S

# MESSAGING - GIF platformu (MSG-22, GIPHY). Anahtar yalniz ortam degiskeninden gelir; bos ise GIF arama ve GIF gonderme
# fail-closed 503 GIF_PROVIDER_UNAVAILABLE doner, diger mesajlasma etkilenmez. Adaptor: giphy (tek uretim degeri).
ltz.messaging.gifs.adapter=giphy
ltz.messaging.gifs.api-url=https://api.giphy.com
ltz.messaging.gifs.api-key=${GIPHY_API_KEY:}
ltz.messaging.gifs.rating=pg-13
ltz.messaging.gifs.default-limit=24
ltz.messaging.gifs.max-limit=50
ltz.messaging.gifs.max-offset=499
ltz.messaging.gifs.max-query-length=50
ltz.messaging.gifs.searches-per-minute=30
