# ==========================================
# LTZ - messaging-service
# ==========================================

# APPLICATION
spring.application.name=messaging-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_MESSAGING_NAME:messaging_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - access token dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE kullanilir;
# degerler Auth Service ile ayni olmalidir.
ltz.messaging.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.messaging.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.messaging.auth.audience=${JWT_AUDIENCE:ltz-api}

# MESSAGING - istek ve grup sinirlari
ltz.messaging.request-limit.max-body-size=8KB
# Sahip dahil grup basina en fazla uye. Social'in engel sorgusu tek cagrida en fazla 100 kimlik kabul eder.
ltz.messaging.groups.max-members=100

# MESSAGING - engel kontrolu (MSG-15): social-service POST /internal/v1/blocks/check. Auth'tan aud=social-service,
# scope=blocks:check servis token'i alinir. Gizli anahtar yalniz ortam degiskeninden gelir; bos ise engel sorgulanamaz
# ve engel kontrolu gereken islemler fail-closed 503 doner.
ltz.messaging.clients.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8080}
ltz.messaging.clients.token-path=/internal/v1/service-tokens
ltz.messaging.clients.client-id=messaging-service
ltz.messaging.clients.client-secret=${AUTH_MESSAGING_SERVICE_CLIENT_SECRET:}
ltz.messaging.clients.social-service-url=${SOCIAL_SERVICE_URL:http://social-service:8080}
# Engel adaptoru: social (tek uretim degeri). Testler kendi sahte adaptorunu secer.
ltz.messaging.blocks.adapter=social
