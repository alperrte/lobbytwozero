# ==========================================
# LTZ - game-service
# ==========================================

# APPLICATION
spring.application.name=game-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}
# Özel geri bildirimlerin MVC validation veya SQL bind loglarına yazılmasını önler.
logging.level.org.springframework.web.method.HandlerMethod=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_GAME_NAME:game_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# Auth D4 hesap silme; yeni ENV gerektirmez.
ltz.game.auth.service-audience=game-service

# LTZ PUAN PROJEKSIYONU (GAME-04/05/15): Review'ın imleçli dışa aktarma ucundan (Game -> Review, svc+jwt) periyodik beslenir.
# Yeni ENV adı yalnız AUTH_GAME_SERVICE_CLIENT_SECRET'tır (gizli anahtar; repoya yazılmaz). Boşsa istemci kapalıdır:
# Review'a istek atılmaz ve puan filtre/sıralaması "hazır değil" kalır (400 RATING_INTEGRATION_PENDING, puan durumu UNAVAILABLE).
ltz.game.rating.auth-service-url=${AUTH_SERVICE_URL}
ltz.game.rating.review-service-url=${REVIEW_SERVICE_URL:http://review-service:8080}
ltz.game.rating.client-secret=${AUTH_GAME_SERVICE_CLIENT_SECRET:}
# Auth ve Review çağrıları için bounded zaman aşımı (genel RestClient ayarından bağımsız; yönlendirme izlenmez).
ltz.game.rating.connect-timeout=1s
ltz.game.rating.read-timeout=2s
ltz.game.rating.page-size=500
# interval: puan projeksiyonunun tazelik sınırı. Gerçek zamanlı tazelik garantisi yoktur.
ltz.game.rating.sync.enabled=true
ltz.game.rating.sync.interval=PT5M
ltz.game.rating.sync.initial-delay=PT30S
ltz.game.rating.sync.lease-ttl=PT2M

# IGDB DETAY KAYNAĞI (GAME-17/23): Steam AppID ile eşlenen açıklama, çıkış tarihi, şirketler ve dil desteği.
# Twitch uygulama kimliği ve gizli anahtarı yalnız ortam değişkeninden gelir (repoya yazılmaz). İkisi de boşsa kaynak
# kapalıdır: hiçbir bean kurulmaz ve IGDB'ye istek atılmaz. IGDB atfı (provenance kaynağı "IGDB") gösterilmelidir.
ltz.game.igdb.client-id=${IGDB_CLIENT_ID:}
ltz.game.igdb.client-secret=${IGDB_CLIENT_SECRET:}

# ITAD fiyatları: boş anahtar = dış fiyat isteği yok. Ana pazar US/USD; diğer pazarlar aşağıdaki markets listesindedir. Kur dönüşümü yapılmaz.
ltz.game.pricing.api-key=${ITAD_API_KEY:}
ltz.game.pricing.country=US
ltz.game.pricing.currency=USD
# Pazar = ülke + o ülkede ITAD'nin gerçekten döndürdüğü para birimi (2026-11-09'da canlı ITAD ile tek tek doğrulandı; her pazar kendi yenileme
# akışını ve yaklaşık 150 bin fiyat satırını getirir). CH, NO, MX, SG, TH, AE, SA gibi ülkelerde ITAD yerel para birimi döndürmez; eklenmez.
# Doğrulanıp henüz açılmayanlar: ID:IDR, PH:PHP, TW:TWD, AR:ARS ve TR:TRY (9 Kasım 2026 canlı pilotunda ITAD Türkiye için TL döndürdü; ürün kararıyla şimdilik kapalı, açılırsa markets listesine eklenir).
ltz.game.pricing.markets=US:USD,GB:GBP,DE:EUR,CA:CAD,AU:AUD,NZ:NZD,PL:PLN,BR:BRL,JP:JPY,KR:KRW,IN:INR,CN:CNY
# Sıcak kademe tazeliği (en çok 2 saat). Ilık kademe 6x (12 sa), soğuk kademe 24x (48 sa): 144 bin oyunluk katalog pazar başına
# dakikada 200 oyunla sürdürülebilir yenilenir (bkz. GamePriceProperties).
ltz.game.pricing.ttl=PT2H

# MEDIA URL POLICY (GAME-13): geliştirici/admin medya bağlantıları için tek yönetim noktası.
# Kayıt biçimi: host veya host/yol-öneki. Yalnız HTTPS ve tam host eşleşmesi kabul edilir; liste boşsa o türde
# hiçbir bağlantı kabul edilmez. Sunucu bu adreslere istek atmaz. Yeni kaynak eklemek bilinçli bir güvenlik kararıdır.
# Kaynaklar 2026-10-21'de gerçek Steam mağaza sayfası ve örnek URL'lerle doğrulandı (Faz 4 raporu).
ltz.game.media.image-sources=shared.akamai.steamstatic.com/store_item_assets/steam/apps/,shared.fastly.steamstatic.com/store_item_assets/steam/apps/,cdn.akamai.steamstatic.com/steam/apps/
ltz.game.media.video-sources=www.youtube.com/watch,www.youtube.com/embed/,www.youtube-nocookie.com/embed/,youtu.be/,vimeo.com/,player.vimeo.com/video/
ltz.game.media.demo-sources=store.steampowered.com/app/

# AUTH JWT: RS256, at+jwt; özel anahtar yalnız Auth Service'te kalır.
# AUTH_SERVICE_URL yoksa yapılandırma çözümlenemez ve uygulama güvenli biçimde başlamaz.
ltz.security.jwt.issuer=${JWT_ISSUER:ltz-auth}
ltz.security.jwt.audience=${JWT_AUDIENCE:ltz-api}
ltz.security.jwt.jwk-set-uri=${AUTH_SERVICE_URL}/api/v1/auth/.well-known/jwks.json

# RATE LIMIT: herkese açık toplu kart ucu (POST /api/v1/game/games/batch) için istemci başına jeton kovası.
# capacity: ani yük, refill-per-second: sürekli izin verilen istek/sn. Aşımda 429 + Retry-After.
ltz.rate-limit.batch.capacity=100
ltz.rate-limit.batch.refill-per-second=20
ltz.rate-limit.max-keys=10000
# trusted-proxies BİLEREK boştur: X-Forwarded-For yok sayılır ve anahtar doğrudan bağlantı adresidir. API Gateway istemci IP'sini
# güvenilir biçimde iletecek şekilde yapılandırılıp doğrulanmadan doldurmayın (aksi halde sahte başlıkla sınır atlatılır).
# ltz.rate-limit.trusted-proxies=<gateway CIDR>

# Arka plan işleri (katalog aktarımı, toplu detay, mağaza tamamlama, fiyat, puan) birbirinin bekleme süresini beklemesin.
spring.task.scheduling.pool.size=4
