# ==========================================
# LTZ - game-service: CANLI (prod) profili — SPRING_PROFILES_ACTIVE=prod
# ==========================================
# Varsayılan application.properties geliştirme makineleri içindir (ortak Steam anahtarı). Canlıda tek servis örneği kendi anahtarlarıyla çalışır;
# veriyi olabildiğince gerçek zamanlıya yaklaştırmak için süreler kısalır. Kota hesabı (bir canlı örnek): Steam ≈80 bin çağrı/gün (sınır
# anahtar başına 100.000), ITAD ≈7,5 bin istek/saat (istemci sınırı 5 dakikada ≈850; ITAD sınırı 1000), IGDB ≈105 bin istek/gün (yalnız IGDB açıksa).
# Yeni ENV değişkeni gerekmez.

# Fiyat (ITAD, tüm mağazalar): sıcak 20 dk, ılık 2 sa, soğuk 8 sa.
ltz.game.pricing.ttl=PT20M
# Canlı ITAD hesabı (doğrulanmış): 5 dakikada 1000 istek beyanı; istemci 850'de durur, 150'si sayfası açılan oyunlara ayrılır. adaptive=true: ilk 429'da kendini ayarlar.
ltz.game.pricing.rate.limit=850
ltz.game.pricing.rate.reserve=150
ltz.game.pricing.rate.floor=100

# Yeni oyun/DLC keşfi: her 15 dakikada bir artımlı Steam turu.
ltz.game.catalog.sync-interval=PT15M
# IGDB'de kanıtı olmayan ya da yalnız Steam türüyle sınıflı kaydın IGDB'ye yeniden sorulması: yeni kayıt 1 sa, eski kayıt 12 sa.
ltz.game.refresh.igdb-recheck.recent=PT1H
ltz.game.refresh.igdb-recheck.old=PT12H

# Çıkış durumu (erken erişim, ücretsiz, yakında, +18, mağazadan kaldırılma; Steam): sıcak 15 dk, diğerleri 4 sa.
ltz.game.refresh.release.hot=PT15M
ltz.game.refresh.release.other=PT4H
# Detay (IGDB): sıcak 15 dk, diğerleri 2 sa.
ltz.game.refresh.details.hot=PT15M
ltz.game.refresh.details.other=PT2H
# Sıcak oyunların Steam fiyatı her turda doğrudan Steam'den alınır (ITAD'in Steam satırının yerini alır).
ltz.game.refresh.steam-price.hot-direct=true

# Steam istek bütçesi: iki çağrı arası en az 600 ms ve günde en çok 90.000 çağrı (resmî sınır anahtar başına 100.000/gün; pay bırakılır).
ltz.game.steam.min-interval-millis=600
ltz.game.steam.daily-budget=90000
