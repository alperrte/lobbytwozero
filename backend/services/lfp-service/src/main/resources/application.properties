# ==========================================
# LTZ - lfp-service
# ==========================================

# APPLICATION
spring.application.name=lfp-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_LFP_NAME:lfp_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - access token dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE kullanilir;
# degerler Auth Service ile ayni olmalidir.
ltz.lfp.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.lfp.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.lfp.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servisler arasi (ic uc) token'in hedef servis adi (docs-auth/servis-sozlesmeleri.md D4): aud=lfp-service
ltz.lfp.auth.service-audience=lfp-service

# LFP - ilan kurallari (LFP-01..09, LFP-15). Sure ilan olusturulurken secilir: 1 saat - 7 gun, varsayilan 24 saat.
ltz.lfp.listings.default-duration=PT24H
ltz.lfp.listings.min-duration=PT1H
ltz.lfp.listings.max-duration=P7D
# Planlanan oyun zamaninin en uzun araligi (baslangic -> bitis).
ltz.lfp.listings.max-play-window=PT24H
# Kotuye kullanim sinirlari (SECURITY.md 12): kullanici basina ayni anda acik ilan ve saatlik yeni ilan.
ltz.lfp.listings.max-open-per-owner=5
ltz.lfp.listings.max-created-per-hour=10
# Liste/arama sayfa boyutu (LFP-10, LFP-11).
ltz.lfp.listings.default-page-size=20
ltz.lfp.listings.max-page-size=50
# Suresi dolan ilanlari EXPIRED yapan zamanlayici (LFP-15). Okumalar suresi gecmis ilani zaten EXPIRED gosterir.
ltz.lfp.expiry.enabled=true
ltz.lfp.expiry.interval=PT1M
ltz.lfp.expiry.batch-size=500
ltz.lfp.expiry.max-batches-per-run=20
ltz.lfp.request-limit.max-body-size=8KB

# GAME - ilanin oyunu game-service'in herkese acik kart ucuyla dogrulanir (LFP-02, LFP-18): GET /api/v1/game/{id}/card.
# Token gerekmez; yanit gelmezse ilan acilmaz (503).
ltz.lfp.clients.game-service-url=${GAME_SERVICE_URL:http://game-service:8080}
ltz.lfp.clients.game-card-path=/api/v1/game/{gameId}/card
# Oyun adaptoru: game (tek uretim degeri). Testler kendi sahte adaptorunu secer.
ltz.lfp.games.adapter=game

# SOCIAL - engel kontrolu (LFP-17): social-service POST /internal/v1/blocks/check. Auth'tan aud=social-service,
# scope=blocks:check servis token'i alinir. Gizli anahtar yalniz ortam degiskeninden gelir; bos ise engel
# sorgulanamaz ve ilan okuma/iletisim fail-closed 503 doner.
ltz.lfp.clients.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8080}
ltz.lfp.clients.token-path=/internal/v1/service-tokens
ltz.lfp.clients.client-id=lfp-service
ltz.lfp.clients.client-secret=${AUTH_LFP_SERVICE_CLIENT_SECRET:}
ltz.lfp.clients.social-service-url=${SOCIAL_SERVICE_URL:http://social-service:8080}
ltz.lfp.clients.blocks-check-path=/internal/v1/blocks/check
# Engel adaptoru: social (tek uretim degeri). Testler kendi sahte adaptorunu secer.
ltz.lfp.blocks.adapter=social
