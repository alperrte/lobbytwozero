# ==========================================
# LTZ - review-service
# ==========================================

# APPLICATION
spring.application.name=review-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_REVIEW_NAME:review_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# REV-13 kötüye kullanım kotaları: hesap başına, sabit pencere, PostgreSQL'de ortak sayaç.
# İnceleme oluşturma ve beğenme/kaldırma (ortak kota) için; yeni ENV gerektirmez.
ltz.review.abuse.review-create.limit=5
ltz.review.abuse.review-create.window=60s
ltz.review.abuse.review-like.limit=60
ltz.review.abuse.review-like.window=60s

# Auth D4 hesap silme; yeni ENV gerektirmez.
ltz.review.auth.service-audience=review-service
ltz.security.jwt.issuer=${JWT_ISSUER:ltz-auth}
ltz.security.jwt.jwk-set-uri=${AUTH_SERVICE_URL}/api/v1/auth/.well-known/jwks.json
# REV-07/REV-13: rapor oluşturma kotası (geçici varsayılan; Admin ile nihai değer kararlaştırılır)
ltz.review.abuse.report-create.limit=10
ltz.review.abuse.report-create.window=3600s
# REV-10: Review -> User olay teslimi. Secret boşsa kapalıdır (Auth'a ve User'a istek atılmaz); doldurmak ENV onayı gerektirir.
ltz.review.user-events.auth-url=${AUTH_SERVICE_URL:http://auth-service:8080}
ltz.review.user-events.user-url=${USER_SERVICE_URL:http://user-service:8080}
ltz.review.user-events.client-secret=${AUTH_REVIEW_SERVICE_CLIENT_SECRET:}
ltz.review.user-events.interval=5s
ltz.review.user-events.batch-size=50
