# ==========================================
# LTZ - auth-service
# ==========================================

# APPLICATION
spring.application.name=auth-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}
# GIZLILIK: genel DEBUG/TRACE (LOG_LEVEL veya debug bayragi) acilsa bile asagidaki logger'lar INFO'da kalir. Acik (daha ozel) logger
# ayari genel seviyeyi ezer. Bu satirlar kaldirilmaz; DEBUG/TRACE production'da acilmaz. Regresyon: *DebugLoggingTest.
# - web.client: giden HTTP formlari (Google/Steam OAuth) client_secret, code, state ve code_verifier icerir
logging.level.org.springframework.web.client=INFO
# - hibernate.orm.core: DEBUG'ta varlik dokumu (Account: e-posta, parola ozeti, token surumu) yazar
logging.level.org.hibernate.orm.core=INFO
# - hibernate.orm.jdbc.*: TRACE'te SQL parametre degerleri (e-posta, hash, kodlar)
logging.level.org.hibernate.orm.jdbc=INFO
# - hibernate.orm.resource: TRACE'te hazir ifade (PreparedStatement) nesnesini, yani baglanmis parametre degerlerini yazar
logging.level.org.hibernate.orm.resource=INFO
# - springframework.jdbc: TRACE'te JdbcTemplate parametre degerleri
logging.level.org.springframework.jdbc=INFO
# - postgresql: surucu sorgu ve parametre izleri
logging.level.org.postgresql=INFO
# - mvc.method.annotation: DEBUG'ta yanit govdelerini (token, kurtarma kodlari) yazar
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
# - DispatcherServlet: TRACE'te istek parametreleri (OAuth callback code/state)
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
# - web.method: TRACE'te kontrolcu metodu argumanlarini (OAuth callback code ve state) yazar
logging.level.org.springframework.web.method=INFO

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_AUTH_NAME:auth_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# PostgreSQL hata ayrintisi (ornegin unique ihlalindeki e-posta degeri) exception mesajina ve loglara yazilmaz.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - E-POSTA DOGRULAMA (AUTH-02)
# Kod uzunlugu (6) gereksinim sabitidir; burada yalniz sure ve limitler ayarlanir.
ltz.auth.verification.code-ttl=${AUTH_OTP_TTL:PT10M}
ltz.auth.verification.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
ltz.auth.verification.resend-cooldown=${AUTH_OTP_RESEND_COOLDOWN:PT60S}
ltz.auth.verification.daily-limit=${AUTH_OTP_DAILY_LIMIT:5}
# Varsayilan yok: anahtar eksik veya 32 bayttan kisaysa servis baslamaz.
ltz.auth.verification.hmac-key=${AUTH_OTP_HMAC_KEY}

# AUTH - JWT (RS256 + JWKS). Ozel anahtarin varsayilani yok: eksik veya 3072 bitten zayifsa servis baslamaz.
ltz.auth.jwt.issuer=${JWT_ISSUER:ltz-auth}
ltz.auth.jwt.audience=${JWT_AUDIENCE:ltz-api}
ltz.auth.jwt.access-token-ttl=${JWT_ACCESS_TTL_SECONDS:60}s
ltz.auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY}
# Opsiyonel: JWKS'te imza anahtarinin yaninda yayinlanan yalniz-dogrulama acik anahtarlari (Base64 X.509 DER, virgulle ayrilir). Bos = yok.
ltz.auth.jwt.additional-public-keys=${AUTH_JWT_ADDITIONAL_PUBLIC_KEYS:}
# Servis token istemcileri (client credentials). İstemci kimliği servis adıdır; token'ın sub'ı svc:<istemci> olur.
# Gizli anahtar BOŞSA istemci devre dışıdır (fail-closed); doluysa en az 32 karakter olmalı (üretici betik 256 bit üretir).
# scopes: Auth'un kendisine (aud=auth-service) alınabilen kapsamlar. targets.<servis>-service: o servise (aud=<servis>-service)
# alınabilen kapsamlar. Kimseye varsayılan imtiyaz yok: listede olmayan hedef için token verilmez. Kapsamlar kodda tanımlı olanlardan seçilir.
ltz.auth.service-clients.clients.admin-service.secret=${AUTH_ADMIN_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.admin-service.scopes=account:read,account:status:write,account:role:write
ltz.auth.service-clients.clients.admin-service.targets.community-service=events:ingest
ltz.auth.service-clients.clients.social-service.secret=${AUTH_SOCIAL_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.social-service.targets.community-service=events:ingest
ltz.auth.service-clients.clients.community-service.secret=${AUTH_COMMUNITY_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.community-service.targets.admin-service=events:ingest
ltz.auth.service-clients.clients.community-service.targets.notification-service=events:ingest
# Engel sorgusu (Social'in POST /internal/v1/blocks/check ucu): messaging ve lfp yalniz social-service icin blocks:check alir.
ltz.auth.service-clients.clients.messaging-service.secret=${AUTH_MESSAGING_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.messaging-service.targets.social-service=blocks:check
ltz.auth.service-clients.clients.lfp-service.secret=${AUTH_LFP_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.lfp-service.targets.social-service=blocks:check
# User Service (docs-auth/servis-sozlesmeleri.md §3.5): gizlilik kararı (privacy:read) ve özet olayları (events:ingest) user-service'e gider.
# User kimseyi çağırmaz, Social/Library/Review verisi olayla gelir; bu yüzden user-service için istemci yoktur.
# social-service zaten community'ye olay yazan istemcidir; user hedefi eklenir.
ltz.auth.service-clients.clients.social-service.targets.user-service=privacy:read,events:ingest
ltz.auth.service-clients.clients.library-service.secret=${AUTH_LIBRARY_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.library-service.targets.user-service=privacy:read,events:ingest
ltz.auth.service-clients.clients.hardware-service.secret=${AUTH_HARDWARE_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.hardware-service.targets.user-service=privacy:read
ltz.auth.service-clients.clients.review-service.secret=${AUTH_REVIEW_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.review-service.targets.user-service=events:ingest
# Library öneri sinyali (LIB-14): recommendation -> library, tek hesaba bağlı (istekte accountId zorunlu).
ltz.auth.service-clients.clients.recommendation-service.secret=${AUTH_RECOMMENDATION_SERVICE_CLIENT_SECRET:}
ltz.auth.service-clients.clients.recommendation-service.targets.library-service=signals:read

# AUTH - OTURUM (refresh rotation). prod profilinde secure-cookies=false ile servis baslamaz.
ltz.auth.session.refresh-token-ttl=${JWT_REFRESH_TTL_SECONDS:604800}s
ltz.auth.session.absolute-ttl=${AUTH_SESSION_ABSOLUTE_TTL:P30D}
ltz.auth.session.refresh-reuse-grace=${AUTH_REFRESH_REUSE_GRACE:PT10S}
ltz.auth.session.secure-cookies=${AUTH_SECURE_COOKIES:true}

# AUTH - BRUTE-FORCE SINIRI (parola ve 2FA denemeleri)
ltz.auth.attempts.max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
ltz.auth.attempts.window=${AUTH_LOGIN_ATTEMPT_WINDOW:PT15M}
ltz.auth.attempts.lock-duration=${AUTH_LOGIN_LOCK_DURATION:PT15M}

# AUTH - 2FA (TOTP). Sifreleme anahtarinin varsayilani yok.
ltz.auth.two-factor.issuer=${AUTH_2FA_ISSUER:LTZ}
ltz.auth.two-factor.encryption-key=${AUTH_TOTP_ENCRYPTION_KEY}
ltz.auth.two-factor.challenge-ttl=${AUTH_MFA_CHALLENGE_TTL:PT5M}
ltz.auth.two-factor.max-challenge-attempts=${AUTH_2FA_MAX_ATTEMPTS:5}
ltz.auth.two-factor.recovery-code-count=${AUTH_2FA_RECOVERY_CODE_COUNT:10}
ltz.auth.two-factor.allowed-clock-skew-steps=${AUTH_2FA_CLOCK_SKEW_STEPS:1}
ltz.auth.two-factor.required-roles=${AUTH_2FA_REQUIRED_ROLES:ADMIN,MODERATOR}

# AUTH - HARICI GIRIS (Steam OpenID 2.0, Google OIDC). Google client bilgileri bos ise Google girisi kapalidir.
ltz.auth.oauth.public-base-url=${AUTH_PUBLIC_BASE_URL:http://localhost:5080}
ltz.auth.oauth.frontend-redirect-url=${FRONTEND_PUBLIC_URL:http://localhost:5001}/auth/callback
ltz.auth.oauth.flow-ttl=${AUTH_OAUTH_FLOW_TTL:PT10M}
ltz.auth.oauth.http-timeout=PT5S
ltz.auth.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
ltz.auth.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
ltz.auth.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
ltz.auth.oauth.google.token-uri=https://oauth2.googleapis.com/token
ltz.auth.oauth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
ltz.auth.oauth.google.issuer=https://accounts.google.com
ltz.auth.oauth.steam.open-id-endpoint=https://steamcommunity.com/openid/login
ltz.auth.oauth.steam.assertion-max-age=${AUTH_STEAM_ASSERTION_MAX_AGE:PT5M}
ltz.auth.oauth.steam.registration-ttl=${AUTH_STEAM_REGISTRATION_TTL:PT15M}
ltz.auth.oauth.steam.verification-proof-ttl=${AUTH_STEAM_PROOF_TTL:PT30M}

# AUTH - PAROLA SIFIRLAMA (AUTH-10). Baglanti tabani sabittir; token URL fragment'ine eklenir.
ltz.auth.password-reset.token-ttl=${AUTH_PASSWORD_RESET_TTL:PT30M}
ltz.auth.password-reset.request-cooldown=${AUTH_PASSWORD_RESET_COOLDOWN:PT60S}
ltz.auth.password-reset.link-base-url=${FRONTEND_PUBLIC_URL:http://localhost:5001}/auth/reset-password

# AUTH - HESAP SILME (AUTH-16). targets: kullanici verisi tutan servisler; hepsi silmeyi onaylamadan hesap DELETED olmaz.
# Henuz gelistirilmemis servisler listede kalir: silme gorevleri PENDING kalir, hesap tamamlanmis gosterilmez.
# Verisi olmayan servis de ic ucu acip 204 doner; Auth "uygulanamaz" beyanini kendi kendine kabul etmez (S2).
ltz.auth.deletion.targets=user,mail,game,library,review,social,messaging,lfp,community,content,event,hardware,recommendation,performance,admin,notification
# Her hedefin ic adresi (Gateway ile ayni *_SERVICE_URL degiskenleri); eksik hedefte servis acilmaz.
ltz.auth.deletion.service-urls.user=${USER_SERVICE_URL:http://user-service:8080}
ltz.auth.deletion.service-urls.mail=${MAIL_SERVICE_URL:http://mail-service:8080}
ltz.auth.deletion.service-urls.game=${GAME_SERVICE_URL:http://game-service:8080}
ltz.auth.deletion.service-urls.library=${LIBRARY_SERVICE_URL:http://library-service:8080}
ltz.auth.deletion.service-urls.review=${REVIEW_SERVICE_URL:http://review-service:8080}
ltz.auth.deletion.service-urls.social=${SOCIAL_SERVICE_URL:http://social-service:8080}
ltz.auth.deletion.service-urls.messaging=${MESSAGING_SERVICE_URL:http://messaging-service:8080}
ltz.auth.deletion.service-urls.lfp=${LFP_SERVICE_URL:http://lfp-service:8080}
ltz.auth.deletion.service-urls.community=${COMMUNITY_SERVICE_URL:http://community-service:8080}
ltz.auth.deletion.service-urls.content=${CONTENT_SERVICE_URL:http://content-service:8080}
ltz.auth.deletion.service-urls.event=${EVENT_SERVICE_URL:http://event-service:8080}
ltz.auth.deletion.service-urls.hardware=${HARDWARE_SERVICE_URL:http://hardware-service:8080}
ltz.auth.deletion.service-urls.recommendation=${RECOMMENDATION_SERVICE_URL:http://recommendation-service:8080}
ltz.auth.deletion.service-urls.performance=${PERFORMANCE_SERVICE_URL:http://performance-service:8080}
ltz.auth.deletion.service-urls.admin=${ADMIN_SERVICE_URL:http://admin-service:8080}
ltz.auth.deletion.service-urls.notification=${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
ltz.auth.deletion.http-timeout=${AUTH_DELETION_HTTP_TIMEOUT:PT5S}
ltz.auth.deletion.token-ttl=${AUTH_DELETION_TOKEN_TTL:PT30M}
ltz.auth.deletion.request-cooldown=${AUTH_DELETION_REQUEST_COOLDOWN:PT60S}
ltz.auth.deletion.recent-login-window=${AUTH_DELETION_RECENT_LOGIN_WINDOW:PT10M}
ltz.auth.deletion.link-base-url=${FRONTEND_PUBLIC_URL:http://localhost:5001}/account/delete
ltz.auth.deletion.worker-enabled=${AUTH_DELETION_WORKER_ENABLED:true}
ltz.auth.deletion.poll-interval=${AUTH_DELETION_POLL_INTERVAL:PT30S}
ltz.auth.deletion.batch-size=${AUTH_DELETION_BATCH_SIZE:20}
ltz.auth.deletion.lease=${AUTH_DELETION_LEASE:PT2M}
ltz.auth.deletion.initial-backoff=${AUTH_DELETION_INITIAL_BACKOFF:PT1M}
ltz.auth.deletion.max-backoff=${AUTH_DELETION_MAX_BACKOFF:PT6H}
ltz.auth.deletion.stuck-attempts=${AUTH_DELETION_STUCK_ATTEMPTS:10}
# Silme onayindan sonra geri alma suresi (proje sahibi karari 2026-10-24: 14 gun). Yalniz DEV/test icin kisaltilir (PT0S), uretimde P14D kalir.
ltz.auth.deletion.grace-period=${AUTH_DELETION_GRACE_PERIOD:P14D}

# AUTH-17 masaustu cihaz kimligi (B yolu): hesap basina en cok aktif cihaz, kimlik omru, 24 saatte en cok baglama.
# Cihaz token omru (60 sn) ve kapsami (hardware:sync:write) kodda sabittir. Yeni ENV anahtari eklenmedi.
ltz.auth.device.max-active=5
ltz.auth.device.credential-ttl=P365D
ltz.auth.device.daily-bind-limit=10

# AUTH-19 olay cikisi (transactional outbox): AccountStatusChanged, UserRegistered, AccountEmailChanged. Hedef listesi BOS =
# hicbir olay yazilmaz veya gonderilmez. Hedef acmak icin ilgili servisin POST /internal/events ucu ve svc:auth-service icin
# events:ingest kabulu hazir olmali (ornek: ltz.auth.events.targets=community,user). Adresler deletion.service-urls ile ayni.
# Hedefler AUTH_EVENT_TARGETS ile verilir (virgulle ayrilmis servis adlari; bos birakilirsa hicbir olay gonderilmez).
ltz.auth.events.targets=${AUTH_EVENT_TARGETS:}
ltz.auth.events.worker-enabled=true
ltz.auth.events.poll-interval=PT5S
ltz.auth.events.batch-size=20
ltz.auth.events.lease=PT2M
ltz.auth.events.initial-backoff=PT10S
ltz.auth.events.max-backoff=PT1H
ltz.auth.events.stuck-attempts=20
ltz.auth.events.delivered-retention=P7D
ltz.auth.events.http-timeout=PT5S

# AUTH - TEMIZLIK (SEC-01). security-event-retention: docs/database.md saklama tablosu (1 yil), proje sahibi karari 2026-10-24.
# Yeni ENV anahtari eklenmedi (ENV onayi gerekir); gerekirse Spring'in LTZ_AUTH_CLEANUP_SECURITYEVENTRETENTION baglamasi gecerlidir.
ltz.auth.cleanup.security-event-retention=P365D
# pending-account-ttl operasyonel bir sinirdir (dogrulanmayan hesaplar e-posta adresini sonsuza dek tutmasin).
ltz.auth.cleanup.enabled=${AUTH_CLEANUP_ENABLED:true}
ltz.auth.cleanup.interval=${AUTH_CLEANUP_INTERVAL:PT1H}
ltz.auth.cleanup.batch-size=${AUTH_CLEANUP_BATCH_SIZE:1000}
ltz.auth.cleanup.pending-account-ttl=${AUTH_CLEANUP_PENDING_ACCOUNT_TTL:PT24H}
ltz.auth.cleanup.flow-grace=${AUTH_CLEANUP_FLOW_GRACE:PT1H}
ltz.auth.cleanup.nonce-retention=${AUTH_CLEANUP_NONCE_RETENTION:PT1H}
ltz.auth.cleanup.throttle-retention=${AUTH_CLEANUP_THROTTLE_RETENTION:PT1H}
ltz.auth.cleanup.token-retention=${AUTH_CLEANUP_TOKEN_RETENTION:P2D}
ltz.auth.cleanup.session-retention=${AUTH_CLEANUP_SESSION_RETENTION:P7D}

# LOG - istek korelasyon kimligi (X-Request-Id)
logging.pattern.correlation=[%X{requestId:-}]

# AUTH - E-POSTA TESLIM ADAPTORU
# unavailable: teslim reddedilir (varsayilan). dev-smtp yalniz application-dev.properties'te secilir.
# prod profili production'a hazir adaptor olmadan baslamaz (Mail Service entegrasyonu PENDING).
ltz.auth.mail.adapter=unavailable

# AUTH - PAROLA HASH KAYNAK SINIRI (Argon2id ~19 MiB / hash)
ltz.auth.password-hashing.max-concurrent-hashes=${AUTH_ARGON2_MAX_CONCURRENT:4}
ltz.auth.password-hashing.acquire-timeout=${AUTH_ARGON2_ACQUIRE_TIMEOUT:PT0.5S}

# AUTH - ISTEK GOVDESI SINIRI
ltz.auth.request.max-body-size=${AUTH_MAX_BODY_SIZE:8KB}

# ASYNC - dogrulama kodu teslimi (sinirli kuyruk)
spring.task.execution.thread-name-prefix=auth-task-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=PT10S
