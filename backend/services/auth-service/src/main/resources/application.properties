# ==========================================
# LTZ - auth-service
# ==========================================

# APPLICATION
spring.application.name=auth-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_AUTH_NAME:auth_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# PostgreSQL hata ayrintisi (ornegin unique ihlalindeki e-posta degeri) exception mesajina ve loglara yazilmaz.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - E-POSTA DOGRULAMA (AUTH-02)
# Kod uzunlugu (6) gereksinim sabitidir; burada yalniz sure ve limitler ayarlanir.
ltz.auth.verification.code-ttl=PT10M
ltz.auth.verification.max-attempts=5
ltz.auth.verification.resend-cooldown=PT60S
ltz.auth.verification.daily-limit=5
# Varsayilan yok: anahtar eksik veya 32 bayttan kisaysa servis baslamaz.
ltz.auth.verification.hmac-key=${AUTH_OTP_HMAC_KEY}

# AUTH - JWT (RS256 + JWKS). Ozel anahtarin varsayilani yok: eksik veya 3072 bitten zayifsa servis baslamaz.
ltz.auth.jwt.issuer=${JWT_ISSUER:ltz-auth}
ltz.auth.jwt.audience=${JWT_AUDIENCE:ltz-api}
ltz.auth.jwt.access-token-ttl=${JWT_ACCESS_TTL_SECONDS:300}s
ltz.auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY}

# AUTH - OTURUM (refresh rotation). prod profilinde secure-cookies=false ile servis baslamaz.
ltz.auth.session.refresh-token-ttl=${JWT_REFRESH_TTL_SECONDS:604800}s
ltz.auth.session.absolute-ttl=P30D
ltz.auth.session.refresh-reuse-grace=PT10S
ltz.auth.session.secure-cookies=true

# AUTH - BRUTE-FORCE SINIRI (parola ve 2FA denemeleri)
ltz.auth.attempts.max-failures=5
ltz.auth.attempts.window=PT15M
ltz.auth.attempts.lock-duration=PT15M

# AUTH - 2FA (TOTP). Sifreleme anahtarinin varsayilani yok.
ltz.auth.two-factor.issuer=LTZ
ltz.auth.two-factor.encryption-key=${AUTH_TOTP_ENCRYPTION_KEY}
ltz.auth.two-factor.challenge-ttl=PT5M
ltz.auth.two-factor.max-challenge-attempts=5
ltz.auth.two-factor.recovery-code-count=10
ltz.auth.two-factor.allowed-clock-skew-steps=1
ltz.auth.two-factor.required-roles=ADMIN,MODERATOR

# LOG - istek korelasyon kimligi (X-Request-Id)
logging.pattern.correlation=[%X{requestId:-}]

# AUTH - E-POSTA TESLIM ADAPTORU
# unavailable: teslim reddedilir (varsayilan). dev-smtp yalniz application-dev.properties'te secilir.
# prod profili production'a hazir adaptor olmadan baslamaz (Mail Service entegrasyonu PENDING).
ltz.auth.mail.adapter=unavailable

# AUTH - PAROLA HASH KAYNAK SINIRI (Argon2id ~19 MiB / hash)
ltz.auth.password-hashing.max-concurrent-hashes=4
ltz.auth.password-hashing.acquire-timeout=PT3S

# AUTH - ISTEK GOVDESI SINIRI
ltz.auth.request.max-body-size=8KB

# ASYNC - dogrulama kodu teslimi (sinirli kuyruk)
spring.task.execution.thread-name-prefix=auth-task-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=PT10S
