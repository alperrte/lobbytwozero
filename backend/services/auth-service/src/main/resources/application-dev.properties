# ==========================================
# LTZ - auth-service (YALNIZ DEVELOPMENT)
# ==========================================

# Dogrulama e-postalari Mailpit'e iletilir (Compose profili: dev-mail).
# Mailpit e-postayi disariya gondermez; yalniz sahte test hesaplari kullanin.
ltz.auth.mail.adapter=dev-smtp

# Compose icinden servis adi; IDE'den calistirirken LTZ_AUTH_MAIL_DEVSMTP_HOST=localhost verin.
ltz.auth.mail.dev-smtp.host=mailpit
ltz.auth.mail.dev-smtp.port=1025
ltz.auth.mail.dev-smtp.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
ltz.auth.mail.dev-smtp.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
ltz.auth.mail.dev-smtp.from=no-reply@ltz.local
