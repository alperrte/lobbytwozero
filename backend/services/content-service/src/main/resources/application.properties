# ==========================================
# LTZ - content-service
# ==========================================

# APPLICATION
spring.application.name=content-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_CONTENT_NAME:content_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# MULTIPART (CONT-14: gorsel basina en cok 2 MiB; ayrintili dogrulama ImageSanitizer'da)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2560KB

# GAME-SERVICE (CONT-01/13: oyun iliskisinin dogrulanmasi; GAME_SERVICE_URL Compose'ta tum servislere zaten gecirilir)
ltz.clients.game-service.url=${GAME_SERVICE_URL:http://game-service:8080}

# AUTH SERVICE (kullanici token dogrulama, JWKS ile; yeni ENV yok: AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE Compose'ta mevcut)
ltz.content.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.content.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.content.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servis token'ı (svc+jwt) audience'i: yalnız /internal/** uçları (admin-service olayları) için.
ltz.content.auth.service-audience=content-service
