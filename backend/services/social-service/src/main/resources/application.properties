# ==========================================
# LTZ - social-service
# ==========================================

# APPLICATION
spring.application.name=social-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_SOCIAL_NAME:social_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - access token dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE kullanilir;
# degerler Auth Service ile ayni olmalidir.
ltz.social.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.social.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.social.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servisler arasi (ic uc) token'in hedef servis adi (docs-auth/servis-sozlesmeleri.md D4): aud=social-service
ltz.social.auth.service-audience=social-service

# SOCIAL - arkadaslik istegi sinirlari
ltz.social.friend-requests.max-pending-outgoing=100
ltz.social.friend-requests.default-page-size=20
ltz.social.friend-requests.max-page-size=50
ltz.social.request-limit.max-body-size=8KB

# SOCIAL - arkadaslik davet kodu
ltz.social.invite-codes.ttl=P30D
ltz.social.invite-codes.max-uses=50

# AUTH - giden servis cagrilari: Auth'tan hedefe bagli servis token'i (POST /internal/v1/service-tokens, 60 sn) ve
# community-service'e olay iletimi. Gizli anahtar yalniz ortam degiskeninden gelir; bos ise giden olay denenmez.
ltz.social.clients.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8080}
ltz.social.clients.token-path=/internal/v1/service-tokens
ltz.social.clients.client-id=social-service
ltz.social.clients.client-secret=${AUTH_SOCIAL_SERVICE_CLIENT_SECRET:}
ltz.social.clients.community-service-url=${COMMUNITY_SERVICE_URL:http://community-service:8080}

# SOCIAL - outbox (olay sozlesmesi: docs/architecture.md 6.2/6.3). Adaptor: community (UserBlocked/UserUnblocked ->
# community-service, Auth servis token'iyla) ya da unavailable (teslim yok). Relay varsayilan KAPALIDIR; acilinca yalniz
# gizli anahtar tanimliysa olay denenir. Diger olay turlerinin (notification, messaging) Auth'ta hedefi yok: outbox'ta bekler.
ltz.social.outbox.adapter=${SOCIAL_OUTBOX_ADAPTER:community}
ltz.social.outbox.relay-enabled=${SOCIAL_OUTBOX_RELAY_ENABLED:false}
ltz.social.outbox.poll-interval=PT10S
ltz.social.outbox.batch-size=20
ltz.social.outbox.lease=PT1M
ltz.social.outbox.max-attempts=10
ltz.social.outbox.base-backoff=PT30S
ltz.social.outbox.max-backoff=PT1H

# SOCIAL - gizlilik (arkadas listesi gorunurlugu user-service'te tutulur, SOC-12). user-service ucu ve servis kimligi (D4)
# hazir olana kadar tercih okunamaz; baskasinin arkadas listesi fail-closed gizli kalir.
ltz.social.privacy.adapter=unavailable
