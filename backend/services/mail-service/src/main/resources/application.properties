# ==========================================
# LTZ - mail-service
# ==========================================

# APPLICATION
spring.application.name=mail-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_MAIL_NAME:mail_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# MAIL - SMTP gondericisi elle kurulur (SmtpMailSender); Boot mail health gostergesi SMTP kesintisinde /actuator/health'i dusurmesin.
management.health.mail.enabled=false

# LOG GIZLILIGI - dogrulama kodu, baglanti ve alici adresi hicbir log seviyesinde yazilmasin (SECURITY.md S16).
# LOG_LEVEL=DEBUG/TRACE olsa bile SQL parametreleri, JDBC baglamalari ve SMTP konusmasi acilmaz.
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.orm.jdbc.extract=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO
logging.level.jakarta.mail=INFO

# AUTH - servis token'i dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER kullanilir; degerler Auth ile ayni olmali.
# Mail yalniz svc+jwt kabul eder (aud=mail-service, sub=svc:auth-service); kullanici token'i hicbir uc icin gecerli degildir.
ltz.mail.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.mail.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.mail.auth.service-audience=mail-service

# MAIL - istek govdesi ust siniri (iç uclar kucuk JSON alir)
ltz.mail.request-limit.max-body-size=16KB

# MAIL - kuyruktaki dogrulama kodu/baglantisini sifreleyen AES-256-GCM anahtari (Base64, 32 bayt). Bos/gecersizse servis acilmaz.
ltz.mail.crypto.payload-key=${MAIL_PAYLOAD_ENCRYPTION_KEY:}

# MAIL - SMTP. Bos birakilirsa gelistirmede Mailpit (mailpit:1025, TLS yok) kullanilir; prod'da hepsi zorunludur ve TLS sarttir.
ltz.mail.smtp.host=${MAIL_SMTP_HOST:}
ltz.mail.smtp.port=${MAIL_SMTP_PORT:}
ltz.mail.smtp.username=${MAIL_SMTP_USERNAME:}
ltz.mail.smtp.password=${MAIL_SMTP_PASSWORD:}
ltz.mail.smtp.security=${MAIL_SMTP_SECURITY:}
ltz.mail.smtp.from-address=${MAIL_FROM_ADDRESS:}
ltz.mail.smtp.connect-timeout=PT5S
ltz.mail.smtp.read-timeout=PT10S
ltz.mail.smtp.write-timeout=PT10S

# MAIL - e-postadaki baglantilar icin izinli hostlar (virgulle ayrilir). Bos ise yalniz localhost/127.0.0.1 kabul edilir; prod'da zorunlu.
ltz.mail.link.allowed-hosts=${MAIL_ALLOWED_LINK_HOSTS:}

# MAIL - kuyruk isleyici ve saklama. Bunlar dagitim sabitleridir, ENV degildir.
ltz.mail.worker.enabled=true
ltz.mail.worker.poll-interval=PT5S
ltz.mail.worker.batch-size=10
ltz.mail.worker.lease=PT5M
ltz.mail.worker.max-attempts=8
ltz.mail.worker.base-delay=PT1M
ltz.mail.worker.max-delay=PT6H
ltz.mail.worker.notification-max-age=PT24H
ltz.mail.worker.retention=P90D
ltz.mail.worker.retention-interval=PT1H
ltz.mail.worker.retention-batch=500
