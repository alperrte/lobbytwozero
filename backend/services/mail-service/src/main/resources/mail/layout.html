<!DOCTYPE html>
<html lang="{{lang}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="supported-color-schemes" content="dark light">
<title>{{title}}</title>
<style>
  /*
   * LTZ e-posta kabuğu: sitenin navbar + içerik + footer yapısının e-posta karşılığı (frontend footer.tsx,
   * docs/ltz-palette-and-tokens.md). Taban KOYU tema; bütün renkler satır içi (inline) yazılıdır, böylece <style>
   * kuralını yok sayan istemcilerde (Gmail uygulaması, Outlook masaüstü) da koyu görünür. Buradaki sınıflar yalnızca
   * iyileştirmedir: açık tema isteyen istemcilerde açık palete geçer, dar ekranda boşlukları daraltır.
   * Yeni bileşen eklerken sınıf adını şablonlarla (V84 gövdeleri) ortak tutun.
   */
  body { margin: 0; padding: 0; background: #0b0b0f; -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  @media only screen and (max-width: 620px) {
    .px { padding-left: 20px !important; padding-right: 20px !important; }
    .code { font-size: 26px !important; letter-spacing: 5px !important; }
    .logo { width: 112px !important; height: auto !important; }
  }
  @media (prefers-color-scheme: light) {
    body, .wrap { background: #f5f5f7 !important; }
    .card { background: #ffffff !important; border-color: #d6d7de !important; }
    .hdr { background: #eeeff2 !important; border-bottom-color: #d6d7de !important; }
    .t { color: #17171b !important; }
    .h1 { color: #17171b !important; }
    .muted { color: #555b66 !important; }
    .m { background: #f5f5f7 !important; color: #555b66 !important; border-top-color: #d6d7de !important; }
    .ft-brand { color: #17171b !important; }
    .box { background: #eeeff2 !important; border-color: #d6d7de !important; }
    .note { background: #eeeff2 !important; }
    .code { color: #c8142a !important; }
    .hr { border-top-color: #d6d7de !important; }
    .eb-accent { color: #db1b60 !important; }
    .eb-warn { color: #915600 !important; }
    .eb-danger { color: #c8142a !important; }
    .eb-success { color: #167a3e !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#0b0b0f">
<table role="presentation" class="wrap" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0f">
  <tr>
    <td align="center" style="padding:28px 12px">
      <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#141419;border:1px solid #34343c;border-radius:16px">
        <tr>
          <td class="px hdr" bgcolor="#0f0f14" style="padding:18px 32px;background:#0f0f14;border-bottom:1px solid #34343c;border-radius:16px 16px 0 0">
            <img class="logo" src="cid:ltz-logo" alt="LobbyTwoZero" width="132" height="40" style="display:block;border:0;outline:none;width:132px;height:auto">
          </td>
        </tr>
        <tr>
          <td class="px t" style="padding:30px 32px 32px 32px;font-family:'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#e4e4e7">{{content}}</td>
        </tr>
        <tr>
          <td class="px m" bgcolor="#0f0f14" style="padding:22px 32px 24px 32px;background:#0f0f14;border-top:1px solid #34343c;font-family:'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#a0a7b4">{{footer}}</td>
        </tr>
        <tr>
          <td height="3" bgcolor="#e11d2e" style="height:3px;line-height:3px;font-size:0;background:#e11d2e;background-image:linear-gradient(90deg,#e11d2e,#db1b60,#e11d2e);border-radius:0 0 16px 16px">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
