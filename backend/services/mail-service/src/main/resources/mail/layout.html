<!DOCTYPE html>
<html lang="{{lang}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{title}}</title>
<style>
  body { margin: 0; padding: 0; background: #f3f4f6; }
  @media (prefers-color-scheme: dark) {
    body, .wrap { background: #0f1115 !important; }
    .card { background: #181b22 !important; }
    .t { color: #e5e7eb !important; }
    .m { color: #9ca3af !important; border-top-color: #2d3340 !important; }
  }
  @media only screen and (max-width: 620px) {
    .px { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body>
<table role="presentation" class="wrap" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6">
  <tr>
    <td align="center" style="padding:24px 12px">
      <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px">
        <tr>
          <td class="px" style="padding:28px 32px 8px 32px">
            <img src="cid:ltz-logo" alt="LTZ" width="56" height="56" style="display:block;border:0;outline:none">
          </td>
        </tr>
        <tr>
          <td class="px t" style="padding:8px 32px 24px 32px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#111827">{{content}}</td>
        </tr>
        <tr>
          <td class="px m" style="padding:16px 32px 28px 32px;border-top:1px solid #e5e7eb;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#6b7280">{{footer}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
