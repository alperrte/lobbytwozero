# ==========================================
# LTZ - user-service
# ==========================================

# APPLICATION
spring.application.name=user-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_USER_NAME:user_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# AUTH - access token dogrulama (JWKS, RS256). Mevcut AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE kullanilir;
# degerler Auth Service ile ayni olmalidir.
ltz.user.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.user.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.user.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servisler arasi (ic uc) token'in hedef servis adi (docs-auth/servis-sozlesmeleri.md D4): aud=user-service
ltz.user.auth.service-audience=user-service

# USER - istek govdesi ust siniri (JSON uclari; gorsel yukleme uclari asagidaki tur basina sinirini alir)
ltz.user.request-limit.max-body-size=16KB

# USER - profil gorselleri (K3, docs-user/decisions/kararlar.md). Bunlar dagitim sabitleridir, ENV degildir.
# Kok klasor Docker'da user_media volume'udur (docker-compose.yml). Yuklemeler ham govdeyle (PUT, Content-Type image/*) yapilir.
ltz.user.media.root=/data/user-media
ltz.user.media.avatar-max-size=2MB
ltz.user.media.cover-max-size=4MB
ltz.user.media.avatar-large=512
ltz.user.media.avatar-small=128
ltz.user.media.cover-large=1600
ltz.user.media.cover-small=800
ltz.user.media.max-frames=100
ltz.user.media.max-dimension=8000
ltz.user.media.max-pixels=40000000
ltz.user.media.concurrency=2
ltz.user.media.busy-wait=PT3S
ltz.user.media.upload-limit-per-hour=10
ltz.user.media.cleanup-enabled=true
ltz.user.media.cleanup-interval=PT5M
