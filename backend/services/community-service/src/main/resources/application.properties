# ==========================================
# LTZ - community-service
# ==========================================

# APPLICATION
spring.application.name=community-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5542}/${DB_COMMUNITY_NAME:community_db}
spring.datasource.username=${POSTGRES_USER:ltz_dev}
spring.datasource.password=${POSTGRES_PASSWORD}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# RESTCLIENT
spring.http.clients.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}ms
spring.http.clients.read-timeout=${REST_CLIENT_READ_TIMEOUT_MS:5000}ms
spring.http.clients.redirects=dont-follow

# GAME-SERVICE (COM-14: gameId doğrulaması; GAME_SERVICE_URL zaten tüm servislere geçirilir)
ltz.clients.game-service.url=${GAME_SERVICE_URL:http://game-service:8080}

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
# MULTIPART (COM-10: görsel başına en çok 2 MiB; ayrıntılı doğrulama ImageSanitizer'da)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2560KB

# ADMIN-SERVICE / NOTIFICATION-SERVICE (COM-16, COM-18: outbox olaylarinin hedefleri; adresler .env.example'da mevcut)
ltz.clients.admin-service.url=${ADMIN_SERVICE_URL:http://admin-service:8080}
ltz.clients.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8080}

# OUTBOX RELAY (varsayilan KAPALI; alici servis sozlesmeleri ve servisler arasi kimlik modeli netlesince acilir)
ltz.outbox.relay.enabled=false
ltz.outbox.relay.interval-ms=5000
ltz.outbox.relay.batch-size=50
ltz.outbox.relay.max-attempts=10
ltz.outbox.relay.base-backoff-seconds=10
ltz.outbox.relay.lease-seconds=60

# AUTH SERVICE (kullanici ve servis token dogrulama, JWKS ile; yeni ENV yok: AUTH_SERVICE_URL / JWT_ISSUER / JWT_AUDIENCE Compose'ta mevcut)
ltz.community.auth.jwks-uri=${AUTH_SERVICE_URL:http://auth-service:8080}/api/v1/auth/.well-known/jwks.json
ltz.community.auth.issuer=${JWT_ISSUER:ltz-auth}
ltz.community.auth.audience=${JWT_AUDIENCE:ltz-api}
# Servisler arasi (ic uc) token'in hedef servis adi (docs-auth/servis-sozlesmeleri.md D4): aud=community-service
ltz.community.auth.service-audience=community-service
