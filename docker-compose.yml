name: ${COMPOSE_PROJECT_NAME:-ltz-dev}

x-ltz-runtime-env: &ltz-runtime-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5001}
  REST_CLIENT_CONNECT_TIMEOUT_MS: ${REST_CLIENT_CONNECT_TIMEOUT_MS:-3000}
  REST_CLIENT_READ_TIMEOUT_MS: ${REST_CLIENT_READ_TIMEOUT_MS:-5000}
  JWT_ISSUER: ${JWT_ISSUER:-ltz-auth}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-300}
  JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
  TZ: ${TZ:-UTC}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?}
  USER_SERVICE_URL: ${USER_SERVICE_URL:?}
  MAIL_SERVICE_URL: ${MAIL_SERVICE_URL:?}
  GAME_SERVICE_URL: ${GAME_SERVICE_URL:?}
  LIBRARY_SERVICE_URL: ${LIBRARY_SERVICE_URL:?}
  REVIEW_SERVICE_URL: ${REVIEW_SERVICE_URL:?}
  SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL:?}
  MESSAGING_SERVICE_URL: ${MESSAGING_SERVICE_URL:?}
  LFP_SERVICE_URL: ${LFP_SERVICE_URL:?}
  COMMUNITY_SERVICE_URL: ${COMMUNITY_SERVICE_URL:?}
  CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:?}
  EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:?}
  HARDWARE_SERVICE_URL: ${HARDWARE_SERVICE_URL:?}
  RECOMMENDATION_SERVICE_URL: ${RECOMMENDATION_SERVICE_URL:?}
  PERFORMANCE_SERVICE_URL: ${PERFORMANCE_SERVICE_URL:?}
  ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:?}
  NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:?}

x-ltz-db-env: &ltz-db-env
  <<: *ltz-runtime-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-3}
  DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5542}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - ltz_network

  # Yalniz development: e-posta yakalama (disariya gondermez). Prod'da COMPOSE_PROFILES tanimlanmadigi icin baslamaz.
  # Volume yok: test e-postalari container yeniden baslatilinca silinir.
  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    profiles: ["dev-mail"]
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - ltz_network

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
      args:
        SERVICE_NAME: auth-service
    image: ltz/auth-service:${APP_ENV:-dev}
    environment:
      <<: *ltz-db-env
      DB_AUTH_NAME: ${DB_AUTH_NAME:?}
      AUTH_OTP_HMAC_KEY: ${AUTH_OTP_HMAC_KEY:?}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:?}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:5080}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_SERVICE_HOST_PORT:?}:${BACKEND_INTERNAL_PORT:-8080}"
    networks:
      - ltz_network

  user-service:
    restart: unless-stopped
